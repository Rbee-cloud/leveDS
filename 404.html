<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Nap in Progress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body { 
      background: #faf9f6;
      color: #1a1a1a;
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
    }
    
    .emoji {
      font-size: clamp(80px, 15vw, 180px);
      line-height: 1;
      margin-bottom: 20px;
      display: block;
    }
    
    h1 {
      font-size: clamp(48px, 10vw, 120px);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.03em;
      margin-bottom: 40px;
      max-width: 900px;
    }
    
    .subtitle {
      font-size: clamp(20px, 3vw, 32px);
      font-weight: 300;
      line-height: 1.4;
      max-width: 600px;
      margin-bottom: 60px;
      color: #555;
    }
    
    .status {
      font-size: clamp(14px, 1.5vw, 18px);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #999;
      border-top: 1px solid #ddd;
      padding-top: 40px;
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <span class="emoji">🐱💤</span>
  <h1>The cat is sitting on the keyboard</h1>
  <p class="subtitle">We cannot move the cat. That would be rude.<br>Estimated return: When cat decides to relocate.</p>
  <p class="status">Error 404 — Keyboard Occupied</p>
</body>
</html>
